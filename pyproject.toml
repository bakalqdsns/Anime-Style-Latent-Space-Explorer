[project]
name = "anime-visual-language-engine"
version = "0.1.0"
description = "Anime Visual Language Engine — Style Space Analysis & Prompt Reverse Engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["anime", "style-space", "dinov2", "clip", "fastapi", "react", "threejs"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
gpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/yourname/anime-visual-language-engine"
Repository = "https://github.com/yourname/anime-visual-language-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
